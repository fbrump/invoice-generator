[package]
name = "invoice-generator-app"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.8", features = ["macros"] }
chrono = { version = "0.4.44", features = ["serde"] }
csv = "1.4.0"
dotenv = "0.15.0"
rust_xlsxwriter = "0.102.0"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", features = ["runtime-tokio-native-tls", "json", "postgres", "uuid", "chrono" ] }
sqlx-paginated = { version = "0.3.1", features = ["postgres", "tracing"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace"] }
tracing = { version = "0.1.44", features = ["log"]}
tracing-subscriber = { version = "0.3.23", features= [ "env-filter"]}
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "uuid", "yaml"] }
utoipa-axum = "0.3.0"
utoipa-redoc = { version = "7.0.0", features = ["axum"] }
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
utoipa-swagger-ui = { version = "10.0.2", features = ["axum"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
